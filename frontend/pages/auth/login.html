<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Caseirinhos da Vovó</title>
    <link rel="stylesheet" href="../../assets/css/base/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base/reset.css" />
    <link rel="stylesheet" href="../../assets/css/base/typography.css" />
    <link rel="stylesheet" href="../../assets/css/base/layout.css" />
    <link rel="stylesheet" href="../../assets/css/base/utilities.css" />
    <link rel="stylesheet" href="../../assets/css/base/responsive.css" />
    <link rel="stylesheet" href="../../assets/css/components/botao.css" />
    <link rel="stylesheet" href="../../assets/css/components/cabecalho.css" />
    <link rel="stylesheet" href="../../assets/css/components/rodape.css" />
    <link rel="stylesheet" href="../../assets/css/components/campo.css" />
    <link rel="stylesheet" href="../../assets/css/components/checkbox.css" />
    <link rel="stylesheet" href="../../assets/css/components/link.css" />
    <link rel="stylesheet" href="../../assets/css/pages/login.css" />
    <script type="module" src="../../assets/js/pages/login.js" defer></script>
  </head>
  <body class="pagina-login" data-raiz="../../">
    <div data-parcial="header-auth"></div>

    <main id="conteudo" class="login container">
      <section class="login__cartao" aria-labelledby="login-titulo">
        <div class="login__cabecalho">
          <h1 id="login-titulo" class="titulo-pagina">Entrar</h1>
          <p class="login__subtitulo">Acesse sua conta para acompanhar seus pedidos e comprar com mais rapidez.</p>
        </div>

        <form class="login__formulario" data-login="formulario" novalidate>
          <div class="campo" data-campo="usuario">
            <label class="campo__rotulo" for="login-usuario">E-mail ou usuário</label>
            <div class="campo__controle">
              <input class="campo__input" id="login-usuario" name="usuario" type="text" autocomplete="username" placeholder="seuemail@exemplo.com" aria-describedby="login-usuario-erro" required />
            </div>
            <p class="campo__mensagem oculto" id="login-usuario-erro" data-campo-mensagem></p>
          </div>

          <div class="campo" data-campo="senha" data-campo-senha>
            <label class="campo__rotulo" for="login-senha">Senha</label>
            <div class="campo__controle">
              <input class="campo__input campo__input--com-acao" id="login-senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-describedby="login-senha-erro" required />
              <button class="campo__acao" type="button" aria-label="Mostrar senha" aria-pressed="false" data-campo-senha-alternar>
                <svg data-icone="mostrar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="oculto" data-icone="ocultar" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /><path d="M4 4l16 16" />
                </svg>
              </button>
            </div>
            <p class="campo__mensagem oculto" id="login-senha-erro" data-campo-mensagem></p>
          </div>

          <div class="login__opcoes">
            <label class="checkbox">
              <input type="checkbox" name="lembrar" />
              <span>Lembrar-me</span>
            </label>
            <a class="link" href="#recuperar-senha">Esqueci minha senha</a>
          </div>

          <button class="botao botao--primario botao--bloco login__botao" type="submit">Entrar</button>
        </form>

        <div class="login__divisor" role="separator"></div>

        <p class="login__cadastro">Ainda não possui uma conta? <a class="link" href="cadastro.html">Cadastre-se</a></p>
      </section>
    </main>

    <div data-parcial="footer-auth"></div>
  </body>
</html>
